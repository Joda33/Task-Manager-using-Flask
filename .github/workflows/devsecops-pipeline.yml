name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    steps:
    - name: Checar código do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências e Validar Build
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  Security-SAST:
    runs-on: ubuntu-latest
    needs: Build-and-Test
    steps:
    - name: Checar código do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Executar Análise Estática de Código (Bandit)
      run: |
        pip install bandit
        bandit -r todo_project/ -f txt -o bandit-report.txt
      continue-on-error: true

    - name: Executar Análise de Dependências (Pip-audit)
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt
      continue-on-error: true
