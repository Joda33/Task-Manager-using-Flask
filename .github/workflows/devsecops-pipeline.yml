name: DevSecOps Lifecycle Pipeline

on:
  push:
    # O pipeline contempla ramificações dedicadas conforme exigido [3]
    branches: [ "main", "master", "desenvolvimento", "estagio" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ETAPA 3: Job de Build - Validação do Ambiente [3, 4]
  build:
    name: Build e Validação de Sintaxe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências e Validar Build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Garante a consistência do ambiente e sintaxe [3]
          python -m compileall .

  # ETAPA 3: Job de Teste - Testes Automatizados [1, 4]
  test:
    name: Execução de Testes Unitários (Pytest)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: pip install -r requirements.txt pytest

      - name: Executar Testes Automatizados
        run: |
          # O uso do '-m' resolve o erro de ModuleNotFoundError visto anteriormente
          python -m pytest tests/test_app.py --junitxml=junit/test-results.xml

  # ETAPA 4: Job de Segurança - SAST com Bandit [1, 2]
  sast_bandit:
    name: Análise Estática de Código (SAST)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Rodar Bandit (Vulnerabilidades Python)
        run: |
          pip install bandit
          # Gera relatório textual para o PDF final [2, 5]
          bandit -r . -f txt -o bandit-report.txt || true

  # ETAPA 4: Job de Segurança - SCA com Pip-audit [2, 6]
  sca_dependencies:
    name: Análise de Dependências (SCA)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Rodar Pip-audit (CVEs em Bibliotecas)
        run: |
          pip install pip-audit
          # Identifica bibliotecas desatualizadas ou com falhas [6]
          pip-audit -r requirements.txt

  # ETAPA 6: Entrega Contínua (CD) - Deploy em Estágio [7, 8]
  deploy:
    name: Deploy em Ambiente de Estágio (Stage)
    needs: [test, sast_bandit, sca_dependencies]
    runs-on: ubuntu-latest
    # Deploy ocorre apenas após validação nas branches principais [7]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Simular Implantacão
        run: |
          echo "Implantando aplicação no ambiente de estágio para validação DAST..."
          echo "Deploy processado com sucesso!"