name: DevSecOps Lifecycle Pipeline

on:
  push:
    branches: [ "main", "master", "desenvolvimento", "estagio" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ETAPA 3: Job de Build - Validação do Ambiente
  build:
    name: Build e Validação de Sintaxe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências e Validar Build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Validação simples de sintaxe para garantir consistência [4]
          python -m compileall .

  # ETAPA 3: Job de Teste - Testes Automatizados
  test:
    name: Execução de Testes Unitários (Pytest)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: pip install -r requirements.txt pytest

      - name: Executar Testes Automatizados
        run: |
          # Executa o arquivo de teste criado anteriormente [1]
          pytest tests/test_app.py --doctest-modules --junitxml=junit/test-results.xml

  # ETAPA 4: Job de Segurança - SAST com Bandit
  sast_bandit:
    name: Análise Estática de Código (SAST)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Rodar Bandit (Vulnerabilidades Python)
        run: |
          pip install bandit
          # Gera relatório textual e falha se encontrar riscos altos [1, 3]
          bandit -r . -f txt -o bandit-report.txt || true

  # ETAPA 4: Job de Segurança - SCA com Pip-audit
  sca_dependencies:
    name: Análise de Dependências (SCA)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Rodar Pip-audit (Bibliotecas Vulneráveis)
        run: |
          pip install pip-audit
          # Verifica o requirements.txt contra CVEs conhecidas [2, 3]
          pip-audit -r requirements.txt

  # ETAPA 6: Simulação de Deploy (Apenas se jobs anteriores passarem)
  deploy:
    name: Deploy em Ambiente de Estágio (Stage)
    needs: [test, sast_bandit, sca_dependencies]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Implantar em Stage
        run: |
          echo "Implantando aplicação no ambiente de estágio para testes DAST..."
          # Aqui entrariam os scripts de deploy real ou docker push [5, 6]